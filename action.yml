name: Hello World
description: Prints the latest commit message of the checked-out repository.
author: HonzaV

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Print latest commit message
      shell: bash
      run: |
        echo "Hello, World! Latest commit message:"
        git log -1 --pretty=%B
